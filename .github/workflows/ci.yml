name: Clinic checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: clinic_test
          MYSQL_ROOT_PASSWORD: testing-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptesting-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'clinic_test' || ':memory:' }}
      DB_USERNAME: root
      DB_PASSWORD: testing-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build
      - run: php artisan test --compact
      - run: vendor/bin/pint --test
      - run: php artisan view:cache && php artisan route:cache
      - run: composer audit && npm audit
